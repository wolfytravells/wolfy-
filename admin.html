<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WOLFY HOLIDAYS Admin</title><style>
*{box-sizing:border-box}body{margin:0;padding:32px 5%;font-family:Arial,sans-serif;background:#f4f6f2;color:#14251f}main{max-width:1200px;margin:auto}.box{background:white;padding:24px;border-radius:14px;margin:18px 0;box-shadow:0 6px 25px #0000000a}input,select{padding:12px;border:1px solid #ccd6ce;border-radius:8px;width:100%;margin:7px 0 14px}button{padding:12px 18px;background:#1d6a50;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e5ebe6;font-size:13px;vertical-align:top}th{background:#eff5ef}.wrap{overflow:auto}.muted{color:#68776f;font-size:14px}.hidden{display:none}.status{margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><main><h1>WOLFY HOLIDAYS — Owner Dashboard</h1><p class="muted">Private area: manage customer trip enquiries and update their status.</p>
<div class="box" id="login"><h2>Owner login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="loginBtn">Login</button><p id="loginStatus" class="status"></p></div>
<div class="box hidden" id="dash"><div class="actions"><button id="reload">Refresh enquiries</button><button id="logout">Logout</button></div><h2>Trip booking enquiries</h2><p id="dashStatus" class="status"></p><div class="wrap"><table><thead><tr><th>Received</th><th>Customer</th><th>Phone</th><th>Journey date</th><th>Days</th><th>Passengers</th><th>Pickup</th><th>Destination</th><th>Trip type</th><th>Message</th><th>Status</th><th>Update</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://wunngatietydloqjmkde.supabase.co",SUPABASE_ANON_KEY="sb_publishable_gmuzkdHaV2xQqWjoy8MPVg_3BzWqKuA";const ready=SUPABASE_URL.startsWith("https://")&&!SUPABASE_ANON_KEY.startsWith("PASTE_");const db=ready?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;const login=document.getElementById("login"),dash=document.getElementById("dash");function view(x){login.classList.toggle("hidden",x);dash.classList.toggle("hidden",!x);}
async function load(){const s=document.getElementById("dashStatus"),body=document.getElementById("rows");s.textContent="Loading…";body.innerHTML="";const {data,error}=await db.from("traveller_bookings").select("*").order("created_at",{ascending:false}).limit(300);if(error){s.textContent="Unable to load enquiries. Check SQL policies.";return;}s.textContent=data.length+" enquiry/enquiries";data.forEach(b=>{const tr=document.createElement("tr");[new Date(b.created_at).toLocaleString(),b.customer_name,b.phone,b.journey_date,b.number_of_days,b.passengers,b.pickup,b.destination,b.trip_type,b.message||"",b.status].forEach(v=>{const td=document.createElement("td");td.textContent=v??"";tr.appendChild(td);});const td=document.createElement("td"),sel=document.createElement("select");["Pending","Confirmed","Cancelled"].forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;if(v===b.status)o.selected=true;sel.appendChild(o);});sel.onchange=async()=>{const {error}=await db.from("traveller_bookings").update({status:sel.value}).eq("id",b.id);if(error){s.textContent="Could not update status.";sel.value=b.status;}else{s.textContent="Status updated.";b.status=sel.value;}};td.appendChild(sel);tr.appendChild(td);body.appendChild(tr);});}
document.getElementById("loginBtn").onclick=async()=>{const s=document.getElementById("loginStatus");if(!db){s.textContent="Add Supabase URL and anon key in this file.";return;}s.textContent="Signing in…";const {error}=await db.auth.signInWithPassword({email:document.getElementById("email").value,password:document.getElementById("password").value});if(error){s.textContent="Login failed. Check your details.";return;}view(true);load();};
document.getElementById("reload").onclick=load;document.getElementById("logout").onclick=async()=>{await db.auth.signOut();view(false);};(async()=>{if(!db){document.getElementById("loginStatus").textContent="Supabase setup required.";return;}const {data}=await db.auth.getSession();if(data.session){view(true);load();}})();
</script></body></html>
